<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Najwa Aqila</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #3d1b31 0%, #050205 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Dancing Script', cursive, sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #textContainer {
            position: absolute;
            top: 15%; 
            z-index: 2;
            text-align: center;
            opacity: 0;
            animation: fadeIn 4s ease-in-out forwards;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        h1 {
            color: #ffffff;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 20px #ff69b4, 0 0 30px #ff69b4;
            margin: 0;
        }
        .flower {
            font-size: 2.5rem;
            animation: rotate 4s linear infinite;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="textContainer">
    <span class="flower">🌸</span>
    <h1>NAJWA AQILA</h1>
    <span class="flower">🌸</span>
</div>
<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let pulse = 0;
    let growth = 0;

    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        createParticles();
    }

    class Particle {
        constructor() {
            this.init();
        }

        init() {
            this.t = Math.random() * Math.PI * 2;
            this.updatePosition();
            this.size = Math.random() * 2.5 + 0.5;
            this.alpha = Math.random() * 0.8 + 0.2;
        }

        updatePosition() {
            const pulseScale = 0.05 * Math.sin(pulse);
            const scale = Math.min(width, height) * 0.015 * (1 + pulseScale) * growth;
            
            this.x0 = width / 2 + 16 * Math.pow(Math.sin(this.t), 3) * scale;
            this.y0 = height / 2 + 60 - (13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t)) * scale;
            
            this.x = this.x0 + (Math.random() - 0.5) * 20;
            this.y = this.y0 + (Math.random() - 0.5) * 20;
        }

        update() {
            this.updatePosition();
            this.alpha -= 0.01;
            if (this.alpha <= 0) {
                this.alpha = Math.random() * 0.8 + 0.2;
            }
        }

        draw() {
            ctx.fillStyle = `rgba(255, 105, 180, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function createParticles() {
        particles = [];
        for (let i = 0; i < 1200; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(10, 5, 10, 0.2)';
        ctx.fillRect(0, 0, width, height);
        
        if (growth < 1) {
            growth += 0.003;
        }
        
        pulse += 0.04;
        
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', init);
    init();
    animate();
</script>

</body>
</html>
